<!DOCTYPE html>
<html lang="en" data-skin="ops">
<head>
<meta charset="UTF-8">
<title>ScreenGate - AML Sanctions Screening Copilot</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   SCREENGATE — LOCKED DESIGN TOKENS  v0.3
   The look ships in the box. Nobody chooses a font.

   RULES (for the AI building the prototype):
   - Inline this file into index.html. Use ONLY these tokens.
   - No new colors. No new fonts. No emoji as icons.
   - Skins switch by setting data-skin="ops" | "studio" | "term" on <html>.
   - Never render body text below 13px (--fs-0).
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* type */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-0: 13px;  /* meta, log lines — absolute floor */
  --fs-1: 14px;  /* body */
  --fs-2: 16px;  /* emphasized body, buttons */
  --fs-3: 20px;  /* panel titles */
  --fs-4: 28px;  /* page title, stat numbers */
  --lh: 1.5;

  /* spacing & shape */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 10px;
  --radius-sm: 6px;
  --border-w: 1px;

  /* status colors — shared across all skins */
  --ok: #1FA971;        /* pass / approved */
  --warn: #D98E04;      /* needs work / pending */
  --danger: #D64545;    /* fail / escalate / refused */
  --info: #3B82F6;      /* running / info */
}

/* ── SKIN: OPERATIONS (dark) — default ─────────────────────────── */
:root, [data-skin="ops"] {
  --bg: #0F1420;         /* page */
  --bg-raise: #171E2E;   /* panels, cards */
  --bg-inset: #0B0F18;   /* wells, log */
  --line: #263049;       /* borders */
  --ink: #E8EDF7;        /* headings, primary text */
  --ink-2: #9AA6BF;      /* secondary text */
  --ink-3: #5E6A85;      /* meta */
  --accent: #6C8CFF;     /* brand accent: buttons, active states */
  --accent-ink: #FFFFFF; /* text on accent */
  --chip: #1E2740;       /* tags, chips */
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
  --font-body: var(--font-ui);
}

/* ── SKIN: STUDIO (light) ──────────────────────────────────────── */
[data-skin="studio"] {
  --bg: #F6F7FB;
  --bg-raise: #FFFFFF;
  --bg-inset: #EEF0F6;
  --line: #E1E5EF;
  --ink: #131A2A;
  --ink-2: #4C5670;
  --ink-3: #8B93A9;
  --accent: #4056C9;
  --accent-ink: #FFFFFF;
  --chip: #EDF0FA;
  --shadow: 0 1px 2px rgba(19,26,42,.06), 0 12px 28px -14px rgba(19,26,42,.18);
  --font-body: var(--font-ui);
}

/* ── SKIN: TERMINAL (mono) ─────────────────────────────────────── */
[data-skin="term"] {
  --bg: #0C0F0C;
  --bg-raise: #121712;
  --bg-inset: #080B08;
  --line: #223122;
  --ink: #D7F5DC;
  --ink-2: #8FBE97;
  --ink-3: #567A5D;
  --accent: #35D07F;
  --accent-ink: #06130A;
  --chip: #16301E;
  --shadow: 0 0 0 1px rgba(53,208,127,.08), 0 12px 32px -14px rgba(0,0,0,.7);
  --font-body: var(--font-mono);
}

/* ═══ BASE ═══ */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-1); line-height: var(--lh);
}

/* ═══ LAYOUT ═══ */
.topbar {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  background: var(--bg-raise); border-bottom: var(--border-w) solid var(--line);
}
.topbar .product { font-size: var(--fs-2); font-weight: 700; letter-spacing: .01em; }
.topbar .meta { color: var(--ink-3); font-size: var(--fs-0); margin-left: auto; }

.console {
  display: grid; grid-template-columns: 300px 1fr 320px;
  gap: var(--sp-4); padding: var(--sp-4); align-items: start;
  min-height: calc(100vh - 58px);
}
@media (max-width: 1100px) { .console { grid-template-columns: 1fr; } }

/* Phones and tablets: show the payment list OR the payment detail, never both stacked, so opening a
   payment lands on it instead of below the whole list. */
.btn.back-btn { display: none; }
@media (max-width: 1100px) {
  .btn.back-btn { display: inline-flex; margin-bottom: var(--sp-3); }
  body.detail-mode .console > .panel:first-child { display: none; }
  body.detail-mode #todayStrip { display: none !important; }
}

.panel {
  background: var(--bg-raise); border: var(--border-w) solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.panel-head {
  padding: var(--sp-3) var(--sp-4); border-bottom: var(--border-w) solid var(--line);
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-2);
}
.panel-body { padding: var(--sp-4); }

/* ═══ STAGE LABELS — the loop, named on screen ═══ */
.stage {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: var(--sp-4) 0 var(--sp-2);
}
.stage::before {
  content: attr(data-n); display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-size: 11px; letter-spacing: 0;
}

/* ═══ CARDS (case list) ═══ */
.case-card {
  padding: var(--sp-3) var(--sp-4); border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm); background: var(--bg-raise);
  cursor: pointer; margin-bottom: var(--sp-2);
}
.case-card:hover { border-color: var(--accent); }
.case-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.case-card .id { font-family: var(--font-mono); font-size: var(--fs-0); color: var(--ink-3); }
.case-card .title { font-weight: 600; }

/* ═══ CHIPS (one-click demo cases, citations) ═══ */
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 4px 12px; border-radius: 999px;
  background: var(--chip); color: var(--ink-2);
  border: var(--border-w) solid var(--line);
  font-size: var(--fs-0); font-weight: 600; cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--accent); }
.chip.cite { cursor: default; font-family: var(--font-mono); }

/* ═══ OUTPUT FIELDS — labeled, judgeable in under a minute ═══ */
.field { display: grid; grid-template-columns: 250px 1fr; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: var(--border-w) solid var(--line); }
@media (max-width: 760px) { .field { grid-template-columns: 1fr; gap: 0; } }
.field:last-child { border-bottom: 0; }
.field .k { font-size: var(--fs-0); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 2px; }
.field .v { color: var(--ink); }
.field .v.why { color: var(--ink-2); font-style: italic; }

/* ═══ STATUS BADGES ═══ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .04em;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok      { color: var(--ok);     background: color-mix(in srgb, var(--ok) 14%, transparent); }
.badge.warn    { color: var(--warn);   background: color-mix(in srgb, var(--warn) 14%, transparent); }
.badge.danger  { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
.badge.info    { color: var(--info);   background: color-mix(in srgb, var(--info) 14%, transparent); }
.badge.neutral { color: var(--ink-2);  background: var(--chip); }

/* ═══ BUTTONS — the human gate ═══ */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 8px 18px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--line);
  background: var(--bg-raise); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-1); font-weight: 700;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger  { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: #fff; }

/* ═══ THE BOUNDARY LINE — quiet, permanent ═══ */
.boundary-note {
  font-size: var(--fs-0); color: var(--ink-3);
  border-left: 2px solid var(--accent); padding-left: var(--sp-3);
  margin-top: var(--sp-3);
}

/* ═══ RUN LOG ═══ */
.log {
  background: var(--bg-inset); border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm); padding: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-0);
  max-height: 420px; overflow: auto;
}
.log .row { display: flex; gap: var(--sp-3); padding: 3px 0; color: var(--ink-2); }
.log .row .t { color: var(--ink-3); flex: none; }
.log .row .action-approve  { color: var(--ok); }
.log .row .action-edit     { color: var(--warn); }
.log .row .action-escalate { color: var(--danger); }

/* ═══ EVALS ═══ */
.evals-table { width: 100%; border-collapse: collapse; font-size: var(--fs-1); }
.evals-table th {
  text-align: left; font-size: var(--fs-0); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); padding: var(--sp-2) var(--sp-3); border-bottom: var(--border-w) solid var(--line);
}
.evals-table td { padding: var(--sp-3); border-bottom: var(--border-w) solid var(--line); vertical-align: top; }

.scoreboard { display: flex; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.stat {
  flex: 1; padding: var(--sp-4); text-align: center;
  background: var(--bg-raise); border: var(--border-w) solid var(--line); border-radius: var(--radius);
}
.stat .n { font-size: var(--fs-4); font-weight: 800; line-height: 1.1; }
.stat .l { font-size: var(--fs-0); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat.ok .n { color: var(--ok); } .stat.warn .n { color: var(--warn); } .stat.danger .n { color: var(--danger); }

/* ═══ STATES ═══ */
.thinking { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--info); font-weight: 600; }
.thinking::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--info); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  padding: var(--sp-6); text-align: center; color: var(--ink-2);
}
.empty .headline { font-size: var(--fs-3); font-weight: 700; color: var(--ink); margin-bottom: var(--sp-2); }

.error-note {
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  color: var(--danger); font-size: var(--fs-1);
}

/* ═══ Settings (this build only; not a kit class) ═══ */
.settings-bar { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.settings-bar input[type="password"] {
  font-family: var(--font-body); font-size: var(--fs-1);
  background: var(--bg-inset); color: var(--ink); border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 12px; min-width: 260px;
}
.settings-bar .key-status { font-size: var(--fs-0); color: var(--ink-3); }

/* ═══ Top-bar tabs: one grouped control, active tab filled (this build only) ═══ */
.nav-tabs { display: inline-flex; border: var(--border-w) solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-inset); }
.nav-tabs button {
  background: transparent; border: 0; color: var(--ink-2); cursor: pointer;
  padding: 8px 18px; font-family: var(--font-body); font-size: var(--fs-1); font-weight: 700;
}
.nav-tabs button + button { border-left: var(--border-w) solid var(--line); }
.nav-tabs button:hover { color: var(--ink); }
.nav-tabs button.primary { background: var(--accent); color: var(--accent-ink); }

/* ═══ Zones: facts vs ScreenGate's findings vs the person's decision (this build only) ═══ */
.zone { border: var(--border-w) solid var(--line); border-radius: var(--radius); padding: var(--sp-4); margin-top: var(--sp-4); }
.zone-label {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); margin-bottom: var(--sp-2);
}
.zone.facts { background: var(--bg-inset); }
.zone.findings { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.zone.decision { border-left: 4px solid var(--ink-3); }
</style>
</head>
<body>

<div class="topbar" style="flex-wrap: wrap;">
  <div style="max-width: 720px;">
    <div style="display:flex; align-items:baseline; gap: var(--sp-3); flex-wrap: wrap;">
      <span class="product" style="font-size: var(--fs-3); font-weight: 800; color: var(--accent);">ScreenGate</span>
      <span style="font-size: var(--fs-2); font-weight: 500; color: var(--ink); border-left: var(--border-w) solid var(--line); padding-left: var(--sp-3);">Know the risk, before the money moves.</span>
    </div>
    <div style="font-size: var(--fs-0); color: var(--ink-2);">Evidence-based risk screening of flagged payments, so companies avoid fines, legal trouble and losses.</div>
  </div>

  <div class="nav-tabs">
    <button id="navConsoleBtn" onclick="showView('console')">Payments</button>

  </div>
  <span class="chip" id="keyChip" onclick="toggleKeyPanel()" title="Demo setup: your own Anthropic API key">AI key</span>
</div>

<div class="panel" id="settingsPanel" style="display:none; margin: var(--sp-4) var(--sp-4) 0;">
  <div class="panel-head">Settings</div>
  <div class="panel-body settings-bar">
    <label for="apiKeyInput">Anthropic API key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
    <button class="btn" id="saveKeyBtn">Save key</button>
    <button class="btn" id="clearKeyBtn">Clear key</button>
    <span class="key-status" id="keyStatus"></span>
  </div>
</div>

<div id="recordedBanner" style="display:none; margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-3) var(--sp-4); border: var(--border-w) dashed var(--accent); border-radius: var(--radius-sm); background: var(--bg-raise);"></div>

<textarea id="exportBox" rows="6" readonly style="display:none; width: calc(100% - 2 * var(--sp-4)); margin: var(--sp-3) var(--sp-4) 0; font-family: var(--font-mono); font-size: var(--fs-0); background: var(--bg-inset); color: var(--ink); border: var(--border-w) solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-2);"></textarea>

<div id="newPaymentAlert" style="display:none; align-items:center; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-3) var(--sp-4); border: var(--border-w) solid var(--accent); border-radius: var(--radius-sm); background: var(--bg-raise);"></div>

<div id="todayStrip" style="padding: var(--sp-4) var(--sp-4) 0;"></div>

<div class="console" id="consoleView">
  <div class="panel">
    <div class="panel-head" id="caseListHead"></div>
    <div class="panel-body" id="caseListBody"></div>
  </div>

  <div class="panel" id="detailPanel">
    <div class="panel-head">Payment detail</div>
    <div class="panel-body" id="mainWorkArea"></div>
  </div>

  <div class="panel">
    <div class="panel-head">Activity log (<span id="runLogCount">0</span>)</div>
    <div class="panel-body">
      <div class="log" id="runLogPanel"></div>
    </div>
  </div>
</div>

<div id="evalsView" style="display:none; padding: var(--sp-4);">
  <div class="panel">
    <div class="panel-head">How well it works</div>
    <div class="panel-body" id="evalsBody"></div>
  </div>
</div>

const ESCALATION_POLICY = `Section 1 - Confirmed Watchlist Hit
If a counterparty or beneficiary bank name matches a watchlist entity, and the available identity fields (date of birth or incorporation date, nationality, ID number) also match, the hit is Confirmed. A Confirmed hit must never be recommended Pass. Escalate directly to the compliance manager, regardless of transaction amount or jurisdiction risk tier.

Section 2 - Unresolved Identity Match
If a counterparty or beneficiary bank name matches a watchlist entity, but the identity fields needed to compare (date of birth or incorporation date, nationality, or ID number) are missing from the counterparty profile, the hit cannot be cleared or confirmed. Mark the result Unresolved. Escalate before issuing any Pass or EDD recommendation. Never guess or infer a missing field.

Section 3 - Cleared Hit (False Positive)
If a counterparty or beneficiary bank name matches a watchlist entity, but at least one identity field (date of birth or incorporation date, nationality, or ID number) is present for both records and differs, the hit is Cleared. The agent must cite the specific field(s) that differ. A Cleared hit may be recommended Pass. Clearing a hit without citing the specific differentiating field is a policy violation.

Section 4 - Missing Required Data
If a required transaction field (counterparty name, beneficiary bank name, amount, or jurisdiction) is absent from the transaction record, escalate before issuing any recommendation. Do not proceed with a partial screening.

Section 5 - Adverse Media or Legal-Action Signals
If the transaction notes or counterparty profile contain any signal of fraud, criminal activity, or regulatory action tied to the counterparty or its owners, escalate. Assessing adverse media is out of this agent's judgment scope.

Section 6 - Out-of-Corridor or Unscoped Check Type
If the transaction falls outside the UAE-India or UAE-UK corridor, or if the transaction notes surface a signal requiring a check type this agent does not perform - Politically Exposed Person (PEP) status or Ultimate Beneficial Owner (UBO) verification - escalate for manual handling. A clean sanctions screening result does not authorize a Pass recommendation when an unscoped signal is present. State plainly which unscoped check is implicated.

Section 7 - High-Risk Jurisdiction Exposure
If the counterparty or beneficiary bank is domiciled in a jurisdiction rated Black in the jurisdiction risk tiers, and no watchlist name match exists, recommend Enhanced Due Diligence rather than a plain Pass, citing the jurisdiction's risk tier. A jurisdiction rated Grey does not by itself require EDD but should be noted in the findings report. A jurisdiction rated Clear requires no additional jurisdiction-based action.

Section 8 - Human Authority
The agent's output is a recommendation only. It has no authority to clear, block, or escalate a transaction on its own. The compliance analyst makes the final Pass / EDD / Escalate decision.`;

/* ---------- Helpers shared by rendering ---------- */

function findProfile(name) {
  return COUNTERPARTY_PROFILES.find(function (p) { return p.name === name; });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderProfileLine(profile) {
  if (!profile) return "No profile on file.";
  return "DOB/Incorporation: " + (profile.dobOrIncorporation || "(missing)") +
    " | Nationality: " + (profile.nationality || "(missing)") +
    " | ID: " + (profile.idNumber || "(missing)") + " (" + (profile.idIssuingCountry || "-") + ")" +
    " | Address: " + profile.address +
    (profile.notes ? " | Notes: " + profile.notes : "");
}

/* Plain words for the machine labels, so "Why it was flagged" matches the payment-system check
   ("New receiver", "over $10,000", "high-risk country"). Display only; the agent still sees and
   writes the original labels. */
function friendlyTriggers(text) {
  return String(text)
    .replace(/new-counterparty/g, "new receiver")
    .replace(/over-threshold/g, "amount over $" + MOCK_LIMIT_USD.toLocaleString())
    .replace(/high-risk-jurisdiction/g, "high-risk country");
}

function triggerList(t) {
  const list = [];
  if (t.triggerNewCounterparty) list.push("new-counterparty");
  if (t.triggerOverThreshold) list.push("over-threshold");
  if (t.triggerHighRiskJurisdiction) list.push("high-risk-jurisdiction");
  return list.length ? list.join(", ") : "none";
}

let selectedCaseId = null;

function selectCase(id) {
  delete UNSEEN_ARRIVALS[id];
  ALERT_IDS = ALERT_IDS.filter(function (x) { return x !== id; });
  selectedCaseId = id;
  syncDetailMode();
  renderCaseList();
  renderMainPanel();
}

/* On narrow screens an opened payment replaces the list (see the CSS); this flags that state. */
function syncDetailMode() {
  document.body.classList.toggle("detail-mode", !!selectedCaseId);
}

function isNarrowScreen() {
  return window.matchMedia("(max-width: 1100px)").matches;
}

/* A person clicked a payment: open it, and on a phone jump to the top of its detail. */
function openPayment(id) {
  selectCase(id);
  if (isNarrowScreen()) window.scrollTo(0, 0);
}

function backToList() {
  selectedCaseId = null;
  syncDetailMode();
  renderCaseList();
  renderMainPanel();
  window.scrollTo(0, 0);
}

function caseState(id) {
  const human = (CASE_HUMAN_STATE[id] || "").toLowerCase();
  if (human.indexOf("escalate") !== -1) return "escalated";
  if (human.indexOf("approve") !== -1) return "approved";
  if (CASE_RESULTS[id]) return "review";
  return "new";
}

/* The list starts empty. A payment is listed once it has arrived (Simulate incoming payment),
   been opened from a "Jump to an example" shortcut, or the sample set was loaded. */
let samplesLoaded = false;
const OPENED_EXAMPLES = {};

function isListed(id) {
  /* With no AI key, "Load sample payments" lists only the payments that have a saved real answer. */
  return (samplesLoaded && (!recordedMode() || hasRecorded(id))) || !!PAYMENT_ARRIVALS[id] || !!OPENED_EXAMPLES[id];
}

function listedTransactions() {
  return TRANSACTIONS.filter(function (t) { return isListed(t.id); });
}

function loadSamplePayments() {
  samplesLoaded = true;
  renderCaseList();
}

function openExample(id) {
  OPENED_EXAMPLES[id] = true;
  openPayment(id);
}

function queueCounts() {
  const counts = { new: 0, review: 0, approved: 0, escalated: 0 };
  listedTransactions().forEach(function (t) { counts[caseState(t.id)]++; });
  return counts;
}

function setQueueFilter(filter) {
  queueFilter = filter;
  renderCaseList();
}

/* Check-all progress lives in a variable so it survives the list re-rendering
   every time a case changes state mid-sweep. */
let runAllProgressText = "";

/* ---------- Simulated live payment: arrives -> held -> screened -> analyst decides ---------- */

const PAYMENT_ARRIVALS = {};
let paymentSeq = 0;
let simulating = false;

/* Demo story order: a clean payment, a false positive, then the confirmed hit that must be refused.
   Purpose and value date are display-only context. They are NOT sent to the agent, so evals are unaffected. */
const SIM_FEED_ORDER = ["T-1001", "T-1002", "T-1003", "T-1006", "T-1004", "T-1005"];

const PAYMENT_PURPOSE = {
  "T-1001": "Invoice settlement - spice export shipment",
  "T-1002": "Consulting services - quarterly retainer",
  "T-1003": "Goods payment - trade invoice",
  "T-1004": "Commodity purchase - bulk trading order",
  "T-1005": "Commodity trade settlement - metals",
  "T-1006": "Textile export - advance payment"
};

/* The pretend payment system. In a real bank this check happens BEFORE ScreenGate and is owned
   by compliance. Here it is a small mock so the viewer can see why ScreenGate does or doesn't open. */
const MOCK_LIMIT_USD = 10000;

function tierOf(jurisdiction) {
  const row = JURISDICTION_RISK_TIERS.find(function (r) { return r.jurisdiction === jurisdiction; });
  return row ? row.riskTier : "Clear";
}

function mockPaymentSystemCheck(p) {
  const isNew = /^No prior/i.test(p.priorHistory);
  const over = p.amountUsd > MOCK_LIMIT_USD;
  const risky = tierOf(p.counterpartyJurisdiction) !== "Clear" || tierOf(p.beneficiaryBankJurisdiction) !== "Clear";
  return { isNew: isNew, over: over, risky: risky, flagged: isNew || over || risky };
}

function renderTriggerChecks(p) {
  const c = mockPaymentSystemCheck(p);
  /* Laid out side by side (wrapping on narrow screens) so the payment panel stays short. */
  function item(label, yes) {
    return "<div style=\"display:flex; align-items:center; gap: var(--sp-2);\"><span style=\"font-size: var(--fs-0); color: var(--ink-2);\">" +
      label + "</span><span class=\"badge " + (yes ? "warn" : "neutral") + "\">" + (yes ? "Yes" : "No") + "</span></div>";
  }
  let html = "<div style=\"margin-top: var(--sp-3); font-size: var(--fs-0); color: var(--ink-3);\">Payment system check (mocked)</div>";
  html += "<div style=\"display:flex; flex-wrap:wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-1);\">" +
    item("New receiver on this route", c.isNew) +
    item("Amount over $" + MOCK_LIMIT_USD.toLocaleString(), c.over) +
    item("Receiver or bank in a high-risk country", c.risky) + "</div>";
  html += "<div style=\"margin-top: var(--sp-2);\">" + (c.flagged
    ? "<span class=\"badge info\">At least one is Yes: sent to ScreenGate</span>"
    : "<span class=\"badge neutral\">All No: payment continues, ScreenGate not opened</span>") + "</div>";
  return html;
}

/* Invented payment-instruction details. Display-only: the agent screens names, profiles and the
   transaction record, not these fields. All names and numbers are fictional. */
const SIM_ORDERING_CUSTOMERS = ["Al Noor Trading LLC", "Desert Bloom Imports FZ-LLC", "Gulf Harbour Supplies LLC"];
const SIM_ORDERING_BANK = "Harbour Point Bank, Dubai";
const COUNTRY_CODE = { "India": "IN", "United Kingdom": "GB", "UAE": "AE", "Singapore": "SG" };

function paymentDetails(t, arrival) {
  const n = parseInt(t.id.replace(/\D/g, ""), 10);
  const cc = COUNTRY_CODE[t.beneficiaryBankJurisdiction] || "XX";
  const last4 = String((n * 37) % 10000).padStart(4, "0");
  return [
    ["Message type", "Customer credit transfer (MT103-style, simulated)"],
    ["Ordering customer", SIM_ORDERING_CUSTOMERS[n % SIM_ORDERING_CUSTOMERS.length] + " (UAE)"],
    ["Ordering bank", SIM_ORDERING_BANK],
    ["Receiver", t.counterparty],
    ["Receiver's account", cc + "** **** **** " + last4],
    ["Receiver's bank", t.beneficiaryBank],
    ["Amount", "USD " + t.amountUsd.toLocaleString() + ".00"],
    ["Charges", "SHA (shared)"],
    ["Sender reference", "INV-" + (20000 + n * 7)]
  ];
}

function paymentStatus(id) {
  const arrival = PAYMENT_ARRIVALS[id];
  if (!arrival) return null;
  const human = (CASE_HUMAN_STATE[id] || "").toLowerCase();
  if (human.indexOf("escalate") !== -1) return { text: "Escalated to the compliance officer", badge: "danger" };
  if (human.indexOf("approve") !== -1) return { text: "Approved by analyst", badge: "ok" };
  if (arrival.screenError) return { text: "Screening did not complete", badge: "warn" };
  if (CASE_RESULTS[id]) return { text: "Waiting for review", badge: "warn" };
  return { text: "Screening in progress", badge: "info" };
}

function renderPaymentBanner(id) {
  const arrival = PAYMENT_ARRIVALS[id];
  if (!arrival) return "";
  const t = TRANSACTIONS.find(function (x) { return x.id === id; });
  const st = paymentStatus(id);
  const valueDate = new Date(arrival.receivedAt.getTime() + 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
  let html = "<div class=\"panel\" style=\"margin-bottom: var(--sp-3);\"><div class=\"panel-body\">";
  html += "<div style=\"display:flex; gap: var(--sp-3); align-items:center; flex-wrap:wrap; margin-bottom: var(--sp-2);\">" +
    "<strong>Payment instruction " + escapeHtml(arrival.reference) + "</strong>" +
    "<span class=\"badge " + st.badge + "\">" + escapeHtml(st.text) + "</span></div>";
  /* Received / value date / purpose sit in one wrapping row to keep the panel short. */
  function fact(k, v) {
    return "<div><span style=\"font-size: var(--fs-0); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);\">" +
      k + "</span><div>" + escapeHtml(v) + "</div></div>";
  }
  html += "<div style=\"display:flex; flex-wrap:wrap; gap: var(--sp-2) var(--sp-5);\">" +
    fact("Payment made", madeTime(id).toLocaleString()) +
    fact("Reached ScreenGate", arrival.receivedAt.toLocaleString()) +
    fact("Value date", valueDate) +
    fact("Purpose", PAYMENT_PURPOSE[id] || "Trade invoice settlement") + "</div>";
  html += renderTriggerChecks(t);
  html += "<details style=\"margin-top: var(--sp-2);\"><summary style=\"cursor:pointer; font-size: var(--fs-0); color: var(--ink-2);\">Payment instruction details (invented, display-only)</summary>";
  paymentDetails(t, arrival).forEach(function (row) {
    html += "<div class=\"field\"><div class=\"k\">" + escapeHtml(row[0]) + "</div><div class=\"v\">" + escapeHtml(row[1]) + "</div></div>";
  });
  html += "</details>";
  html += "</div></div>";
  return html;
}

function refreshPaymentBanner(id) {
  const el = document.getElementById("payBanner-" + id);
  if (el) el.innerHTML = renderPaymentBanner(id);
}

async function simulateIncomingPayment() {
  if (simulating || checkingAll || samplesLoaded) return;
  const nextId = SIM_FEED_ORDER
    .concat(TRANSACTIONS.map(function (t) { return t.id; }))
    .find(function (id) { return !PAYMENT_ARRIVALS[id] && (!recordedMode() || hasRecorded(id)); });
  if (!nextId) {
    runAllProgressText = recordedMode()
      ? "That is all the recorded examples. Add your own AI key (top right) to try more payments."
      : "No new payments right now.";
    renderCaseList();
    return;
  }

  simulating = true;
  try {
    const now = new Date();
    const ymd = now.toISOString().slice(0, 10).replace(/-/g, "");
    /* The payment was made a few minutes before the payment system sent it to ScreenGate. */
    const madeAt = new Date(now.getTime() - (4 + (paymentSeq % 9)) * 60 * 1000);
    PAYMENT_ARRIVALS[nextId] = { reference: "PAY-" + ymd + "-" + String(++paymentSeq).padStart(4, "0"), receivedAt: now, madeAt: madeAt };

    RUN_LOG.push({
      time: now.toLocaleTimeString(),
      transactionId: nextId,
      agentDecision: "-",
      humanAction: "Payment received - held for screening (simulated)",
      note: PAYMENT_ARRIVALS[nextId].reference
    });
    renderRunLog();

    /* Like a real inbox: the payment lands in the queue and the analyst is told. The analyst is
       not redirected - ScreenGate checks it in the background and they open it when ready. */
    SCREENING_NOW[nextId] = true;
    UNSEEN_ARRIVALS[nextId] = true;
    ALERT_IDS.push(nextId);
    renderCaseList();
    const outcome = await runCaseCore(nextId);
    delete SCREENING_NOW[nextId];
    if (outcome === "error") PAYMENT_ARRIVALS[nextId].screenError = true;
    if (selectedCaseId === nextId) renderMainPanel();
    refreshPaymentBanner(nextId);
    renderCaseList();
  } finally {
    simulating = false;
    renderCaseList();
  }
}

/* ---------- Today's work + "new payment waiting" notification ---------- */

const SCREENING_NOW = {};
/* Arrivals the analyst has not opened yet. UNSEEN_ARRIVALS drives the "New" tag on each card;
   ALERT_IDS (oldest first) drives the top strip and is emptied by Dismiss. Opening a payment
   by any route clears it from both. */
const UNSEEN_ARRIVALS = {};
let ALERT_IDS = [];

function matchesQueueFilter(id) {
  if (queueFilter === "all") return true;
  const s = caseState(id);
  if (queueFilter === "waiting") return s === "new" || s === "review";
  return s === queueFilter;
}

function renderTodayStrip() {
  const el = document.getElementById("todayStrip");
  if (!el) return;
  const c = queueCounts();
  function tile(cls, key, n, label, hoverText, subText) {
    const active = queueFilter === key;
    return "<div class=\"stat " + cls + "\"" + (hoverText ? " title=\"" + hoverText + "\"" : "") + " style=\"cursor:pointer;" + (active ? " border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset;" : "") + "\" onclick=\"setQueueFilter('" + key + "')\">" +
      "<div class=\"n\">" + n + "</div><div class=\"l\">" + label + "</div>" +
      (subText ? "<div style=\"font-size: var(--fs-0); color: var(--ink-2); margin-top: var(--sp-1);\">" + escapeHtml(subText) + "</div>" : "") +
      "</div>";
  }
  const waitingTotal = c.new + c.review;
  const waitingSub = waitingTotal === 0 ? "" : (c.new > 0
    ? c.new + "/" + waitingTotal + " yet to be checked by ScreenGate"
    : "Nothing in queue to be checked by ScreenGate");
  /* Four tiles, all clickable; the highlighted one is what the list below is showing. */
  let html = "<div class=\"scoreboard\" style=\"margin-bottom: 0;\">";
  html += tile("", "all", listedTransactions().length, "All payments");
  html += tile("warn", "waiting", c.new + c.review, "Waiting for review", escapeHtml("Waiting for review: " + (waitingSub || "nothing in the queue")), waitingSub);
  html += tile("ok", "approved", c.approved, "Approved");
  html += tile("danger", "escalated", c.escalated, "Escalated");
  html += "</div>";
  el.innerHTML = html;
}

/* When the payment reached ScreenGate (only payments that arrived through "Check for new payments"). */
function arrivalTime(id) {
  const arrival = PAYMENT_ARRIVALS[id];
  return arrival ? arrival.receivedAt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
}

/* When the payment was actually made, which is what a real payment record would carry, and is
   earlier than the moment it reached ScreenGate. Sample payments get invented clock times today;
   arrivals were made a few minutes before they arrived. Display-only, never sent to the AI. */
const SAMPLE_MADE_TIMES = {
  "T-1001": "09:05", "T-1002": "09:32", "T-1003": "09:48", "T-1004": "10:15",
  "T-1005": "10:41", "T-1006": "11:07", "T-1007": "11:26", "T-1008": "12:02",
  "T-1009": "12:34", "T-1010": "13:10", "T-1011": "13:45", "T-1012": "14:08",
  "T-1013": "14:37", "T-1014": "15:12", "T-1015": "15:40", "T-1016": "16:05"
};

function madeTime(id) {
  const arrival = PAYMENT_ARRIVALS[id];
  if (arrival) return arrival.madeAt;
  const clock = SAMPLE_MADE_TIMES[id];
  if (!clock) return null;
  const d = new Date();
  d.setHours(parseInt(clock.slice(0, 2), 10), parseInt(clock.slice(3, 5), 10), 0, 0);
  return d;
}

function madeTimeText(id) {
  const d = madeTime(id);
  return d ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
}

function renderNewPaymentAlert() {
  const el = document.getElementById("newPaymentAlert");
  if (!el) return;
  if (ALERT_IDS.length === 0) { el.style.display = "none"; return; }
  el.style.display = "flex";

  const latestId = ALERT_IDS[ALERT_IDS.length - 1];
  const t = TRANSACTIONS.find(function (x) { return x.id === latestId; });
  const arrival = PAYMENT_ARRIVALS[latestId];
  const n = ALERT_IDS.length;
  const anyChecking = ALERT_IDS.some(function (id) { return !!SCREENING_NOW[id]; });
  const anyFailed = ALERT_IDS.some(function (id) { return PAYMENT_ARRIVALS[id].screenError; });
  const what = escapeHtml(t.counterparty) + ", $" + t.amountUsd.toLocaleString() + " (" + escapeHtml(arrival.reference) + ")";
  const when = "Arrived " + escapeHtml(arrivalTime(latestId));

  const label = n > 1 ? n + " new payments" : "New flagged payment";
  const lead = n > 1 ? "Latest: " : "";
  if (anyChecking) {
    el.innerHTML = "<span class=\"badge info\">" + label + "</span>" +
      "<span>" + lead + what + "</span><span style=\"font-size: var(--fs-0); color: var(--ink-3);\">" + when + "</span>" +
      "<span class=\"thinking\">ScreenGate is checking " + (n > 1 ? "them" : "it") + " now</span>";
  } else {
    el.innerHTML = "<span class=\"badge warn\">" + (n > 1 ? n + " new payments waiting for review" : (anyFailed ? "Check did not finish" : "New: waiting for review")) + "</span>" +
      "<span>" + lead + what + "</span><span style=\"font-size: var(--fs-0); color: var(--ink-3);\">" + when + "</span>" +
      "<button class=\"btn primary\" onclick=\"openAlertPayment()\">" + (n > 1 ? "Open oldest" : "Open") + "</button>" +
      "<button class=\"btn\" onclick=\"dismissAlert()\">" + (n > 1 ? "Dismiss all" : "Dismiss") + "</button>";
  }
}

function openAlertPayment() {
  const id = ALERT_IDS[0];
  if (id) openPayment(id);
  else renderNewPaymentAlert();
}

function dismissAlert() {
  ALERT_IDS = [];
  renderNewPaymentAlert();
}

function renderCaseList() {
  const body = document.getElementById("caseListBody");

  const head = document.getElementById("caseListHead");
  head.innerHTML = "Flagged payments (" + listedTransactions().length + ")" +
    "<div style=\"font-weight:400; letter-spacing:0; text-transform:none; color: var(--ink-3); margin-top: var(--sp-1);\">Sample data for trying ScreenGate</div>";
  renderTodayStrip();
  renderNewPaymentAlert();

  const smallLabel = "font-size: var(--fs-0); color: var(--ink-3); margin-bottom: var(--sp-1);";
  let html = "";
  /* Everything that only exists to make the demo easy to try sits in one labelled box, apart from the queue. */
  html += "<div style=\"border: var(--border-w) dashed var(--line); border-radius: var(--radius); padding: var(--sp-3);\">";
  html += "<div style=\"font-size: var(--fs-0); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: var(--sp-2);\">Demo controls (not part of the real product)</div>";
  html += "<div style=\"" + smallLabel + "\">Jump to an example</div>";
  html += "<div style=\"margin-bottom: var(--sp-4);\">";
  EVAL_CASES.forEach(function (ec) {
    html += "<span class=\"chip\" onclick=\"openExample('" + ec.transactionId + "')\" title=\"" + escapeHtml(ec.name) + "\">" +
      escapeHtml(EVAL_CHIP_LABELS[ec.caseId] || ec.name) + "</span> ";
  });
  html += "</div>";

  const busy = checkingAll || simulating;
  const simBtn = "<button class=\"btn primary\" onclick=\"simulateIncomingPayment()\"" + ((busy || samplesLoaded) ? " disabled" : "") + ">Check for new payments</button>";
  const loadBtn = samplesLoaded ? "" : "<button class=\"btn\" onclick=\"loadSamplePayments()\"" + (busy ? " disabled" : "") + ">Load sample payments</button>";
  const checkBtn = checkingAll
    ? "<button class=\"btn\" disabled>Checking...</button>" +
      "<button class=\"btn\" onclick=\"pauseCheckAll()\"" + (pauseRequested ? " disabled" : "") + ">Pause</button>"
    : "<button class=\"btn\" onclick=\"runAll()\"" + (simulating ? " disabled" : "") + ">Run all waiting payments</button>";
  html += "<div style=\"display:flex; gap: var(--sp-2); flex-wrap: wrap;\">" + simBtn + loadBtn + checkBtn + "</div>";
  if (samplesLoaded) {
    html += "<p class=\"boundary-note\">Sample payments are loaded, so checking for new payments is switched off. Reload the page to try new arrivals from an empty list.</p>";
  }
  html += "<div id=\"runAllProgress\" class=\"boundary-note\">" + escapeHtml(runAllProgressText) + "</div>";
  html += "</div>";
  html += "<div style=\"margin-top: var(--sp-4);\">";

  const visible = listedTransactions().filter(function (t) { return matchesQueueFilter(t.id); });
  const filterNames = { all: "All payments", waiting: "Waiting for review", approved: "Approved", escalated: "Escalated" };
  html += "<div style=\"font-size: var(--fs-0); color: var(--ink-2); margin-bottom: var(--sp-2);\">Showing: <strong>" +
    filterNames[queueFilter] + " (" + visible.length + ")</strong></div>";
  if (visible.length === 0) {
    html += listedTransactions().length === 0
      ? "<p class=\"boundary-note\">No flagged payments yet. Click Check for new payments to see one arrive, or Load sample payments to fill the list for testing.</p>"
      : "<p class=\"boundary-note\">No payments in this group.</p>";
  }
  visible.forEach(function (t) {
    const isActive = t.id === selectedCaseId;
    const stateKey = caseState(t.id);
    const stateDef = QUEUE_STATES.filter(function (s) { return s.key === stateKey; })[0];
    const humanAction = CASE_HUMAN_STATE[t.id];
    const badgeText = humanAction || stateDef.label;
    const badgeClass = humanAction ? humanActionBadgeClass(humanAction) : stateDef.badge;
    /* Bottom-left line: payment reference (if it arrived) and when it showed up. The status is
       already in the badge above, so it is not repeated here. */
    const ref = PAYMENT_ARRIVALS[t.id] ? escapeHtml(PAYMENT_ARRIVALS[t.id].reference) + " &middot; " : "";
    const timeText = madeTimeText(t.id);
    const payLine = timeText

      payLine +
      "</div>";
  });
  html += "</div>";
  body.innerHTML = html;
}

  const body = document.getElementById("mainWorkArea");

  if (!selectedCaseId) {
    let hasKey = false;
    try { hasKey = !!localStorage.getItem(API_KEY_STORAGE_KEY); } catch (err) { hasKey = false; }

    let html = "<div class=\"empty\">";
    html += "<div class=\"headline\">ScreenGate</div>";

    html += "<div style=\"text-align:left; max-width: 640px; margin: var(--sp-4) auto 0;\">";
    html += "<p><strong>What happens to a payment</strong></p>";
    html += "<ol style=\"padding-left: var(--sp-5);\">";

    html += "<p class=\"boundary-note\">This is a demo. Payments and decisions exist only on this page and are cleared when you reload. ScreenGate checks each payment on its own and does not remember earlier ones.</p>";

    }

  }

  const t = TRANSACTIONS.find(function (x) { return x.id === selectedCaseId; });

  let html = "";

    "<span id=\"rec-" + t.id + "\" style=\"display:inline-flex; align-items:center; gap: var(--sp-2);\">" + renderRecommendationBadge(t.id) + "</span>" +
    "<button class=\"btn primary\" onclick=\"runCase('" + t.id + "')\">Run this payment</button></div>";
  html += "<div class=\"zone facts\"><div class=\"zone-label\">Facts from the payment record</div>";
  html += "<div id=\"payBanner-" + t.id + "\">" + renderPaymentBanner(t.id) + "</div>";

  /* Stages 1 and 2 sit in a fold (closed by default) so the findings and the decision are
     higher on screen; the summary line keeps the key facts visible. */
  html += "<details style=\"margin-top: var(--sp-3);\"><summary style=\"cursor:pointer; color: var(--ink-2);\"><strong>Stage 1 Input and Stage 2 Context</strong> &middot; " +
    escapeHtml(t.counterparty) + " &rarr; " + escapeHtml(t.beneficiaryBank) + " (click to open)</summary>";
  html += "<div class=\"stage\" data-n=\"1\">Input</div>";
  html += "<div class=\"field\"><div class=\"k\">Payment</div><div class=\"v\">" + t.id + ", " + t.corridor + ", $" + t.amountUsd.toLocaleString() + "</div></div>";
  html += "<div class=\"field\"><div class=\"k\">Receiver</div><div class=\"v\">" + escapeHtml(t.counterparty) + " (" + escapeHtml(t.counterpartyJurisdiction) + ")</div></div>";
  html += "<div class=\"field\"><div class=\"k\">Receiver's bank</div><div class=\"v\">" + escapeHtml(t.beneficiaryBank) + " (" + escapeHtml(t.beneficiaryBankJurisdiction) + ")</div></div>";
  html += "<div class=\"field\"><div class=\"k\">Why it was flagged</div><div class=\"v\">" + escapeHtml(friendlyTriggers(triggerList(t))) + "</div></div>";

  html += "<div class=\"stage\" data-n=\"2\">Context</div>";
  html += "<div class=\"field\"><div class=\"k\">Receiver profile</div><div class=\"v\">" + escapeHtml(renderProfileLine(counterpartyProfile)) + "</div></div>";
  html += "<div class=\"field\"><div class=\"k\">Receiver's bank profile</div><div class=\"v\">" + escapeHtml(renderProfileLine(bankProfile)) + "</div></div>";
  html += "<div class=\"field\"><div class=\"k\">Prior History</div><div class=\"v\">" + escapeHtml(t.priorHistory) + "</div></div>";
  if (t.notes) html += "<div class=\"field\"><div class=\"k\">Notes</div><div class=\"v\">" + escapeHtml(t.notes) + "</div></div>";
  html += "<p class=\"boundary-note\">The agent also reads the full watchlist, jurisdiction risk tiers, and escalation policy on every run - not shown here per case since they are the same for all cases.</p>";
  html += "</details>";
  html += "</div>";

  html += "<div id=\"result-" + t.id + "\" style=\"margin-top: var(--sp-4);\">";

  const cached = CASE_RESULTS[t.id];
  const cachedIsRealResult = cached && cached.RECOMMENDED_DECISION &&
    cached.RECOMMENDED_DECISION !== "(unparsed output)" && cached.RECOMMENDED_DECISION !== "(no decision)";
  if (cachedIsRealResult) {
    html += renderParsedOutput(cached, t.id);
  } else if (SCREENING_NOW[t.id]) {
    html += "<span class=\"thinking\">ScreenGate is checking this payment...</span>";
  }

  html += "</div>";
  html += "<div id=\"history-" + t.id + "\">" + renderPaymentHistory(t.id) + "</div>";
  html += "<button class=\"btn back-btn\" style=\"margin-top: var(--sp-4);\" onclick=\"backToList()\">&larr; Back to payments</button>";

  body.innerHTML = html;
}

/* ---------- Wiring the agent: one live decision per Run click ---------- */

const OUTPUT_FIELDS = [
  ["TRANSACTION_ID", "Payment ID"],
  ["CORRIDOR", "Corridor"],
  ["TRIGGER_CRITERIA_MET", "Why it was flagged"],
  ["COUNTERPARTY_SCREENING_RESULT", "Receiver screening result"],
  ["BENEFICIARY_BANK_SCREENING_RESULT", "Receiver's bank screening result"],
  ["CITED_REASONING", "Cited Reasoning"],
  ["PRIOR_TRANSACTION_HISTORY", "Prior payment history"],
  ["RECOMMENDED_DECISION", "Recommended Decision"],
  ["WHY", "Why"]
];

/* CITATIONS is rendered separately as tags, not as a plain labeled row - kept out of OUTPUT_FIELDS */
const CITATIONS_KEY = "CITATIONS";

function parseAgentOutput(text) {
  const keySet = OUTPUT_FIELDS.map(function (f) { return f[0]; }).concat([CITATIONS_KEY]);
  const values = {};
  let currentKey = null;
  text.split("\n").forEach(function (line) {
    const match = line.match(/^([A-Z_]+):\s?(.*)$/);
    if (match && keySet.indexOf(match[1]) !== -1) {
      currentKey = match[1];
      values[currentKey] = match[2];
    } else if (currentKey && line.trim()) {
      values[currentKey] += " " + line.trim();
    }
  });
  const requiredPresent = ["CITATIONS", "CITED_REASONING", "RECOMMENDED_DECISION", "WHY"].every(function (k) {
    return values[k] && values[k].trim().length > 0;
  });
  if (!requiredPresent) return null;
  return values;
}

function renderCitationTags(citationsText) {
  if (!citationsText) return "";
  const items = citationsText.split(",").map(function (s) { return s.trim(); }).filter(function (s) { return s && s.toLowerCase() !== "none"; });
  if (items.length === 0) return "<p class=\"boundary-note\">No specific record or policy section cited.</p>";
  return "<div style=\"margin: var(--sp-3) 0;\">" + items.map(function (item) {
    return "<span class=\"chip cite\">" + escapeHtml(item) + "</span>";
  }).join(" ") + "</div>";
}

/* Shown under stage 3 DECISION (the narrative "what and why"); everything else in
   OUTPUT_FIELDS renders under stage 4 OUTPUT instead. */
const DECISION_FIELD_KEYS = ["RECOMMENDED_DECISION", "WHY"];

/* Plain-language label + colour for ScreenGate's recommendation. */
function decisionBadge(values) {
  const decision = (values.RECOMMENDED_DECISION || "").toLowerCase();
  const isEscalation = decision.indexOf("escalate") !== -1;
  const isExtraChecks = !isEscalation && (decision.indexOf("enhanced") !== -1 || decision.indexOf("edd") !== -1);
  return {
    cls: isEscalation ? "danger" : (isExtraChecks ? "warn" : "ok"),
    text: isEscalation ? "Cannot clear: escalate" : (isExtraChecks ? "Extra checks needed" : "Looks clear")
  };
}

/* The recommendation shown next to the payment title, so the answer to "what does ScreenGate
   say?" is visible before any scrolling. */
function renderRecommendationBadge(id) {
  const r = CASE_RESULTS[id];
  const isReal = r && r.RECOMMENDED_DECISION &&
    r.RECOMMENDED_DECISION !== "(unparsed output)" && r.RECOMMENDED_DECISION !== "(no decision)";
  if (isReal) {
    const b = decisionBadge(r);
    return "<span style=\"font-size: var(--fs-0); color: var(--ink-3);\">ScreenGate recommends</span> <span class=\"badge " + b.cls + "\">" + b.text + "</span>";
  }
  if (SCREENING_NOW[id]) return "<span class=\"thinking\">ScreenGate is checking this payment...</span>";
  return "<span class=\"badge neutral\">Not yet checked</span>";
}

function refreshRecommendation(id) {
  const el = document.getElementById("rec-" + id);
  if (el) el.innerHTML = renderRecommendationBadge(id);
}

function renderParsedOutput(values, transactionId) {
  const b = decisionBadge(values);
  const badgeClass = b.cls;
  const statusText = b.text;

  let html = "<div class=\"zone findings\"><div class=\"zone-label\">ScreenGate's findings <span class=\"badge info\">AI-generated, please verify</span>" +
    (values._recorded ? " <span class=\"badge neutral\">Recorded example, not a live check</span>" : "") + "</div>";
  html += "<div class=\"stage\" data-n=\"3\">Decision</div>";
  html += "<span class=\"badge " + badgeClass + "\">" + statusText + "</span>";
  OUTPUT_FIELDS.forEach(function (f) {
    const key = f[0], label = f[1];
    if (DECISION_FIELD_KEYS.indexOf(key) === -1) return;
    const isWhy = key === "WHY";
    html += "<div class=\"field\"><div class=\"k\">" + escapeHtml(label) + "</div><div class=\"v" + (isWhy ? " why" : "") + "\">" +
      escapeHtml(values[key] || "(not provided)") + "</div></div>";
  });

  html += "<div class=\"stage\" data-n=\"4\">Output</div>";
  html += renderCitationTags(values.CITATIONS);
  OUTPUT_FIELDS.forEach(function (f) {
    const key = f[0], label = f[1];
    if (DECISION_FIELD_KEYS.indexOf(key) !== -1) return;
    const shown = key === "TRIGGER_CRITERIA_MET" && values[key] ? friendlyTriggers(values[key]) : values[key];
    html += "<div class=\"field\"><div class=\"k\">" + escapeHtml(label) + "</div><div class=\"v\">" +
      escapeHtml(shown || "(not provided)") + "</div></div>";
  });

  html += "</div>";

  html += "<div class=\"zone decision\"><div class=\"zone-label\">Your decision (a person decides)</div>";
  html += "<div class=\"stage\" data-n=\"5\">Review</div>";
  html += renderGate(transactionId);
  html += "</div>";
  return html;
}

/* ---------- The human gate: nothing is complete without a click ---------- */

const CASE_RESULTS = {};
const RUN_LOG = [];

/* The human's final action per case (Approved / Edited / Escalated / Approved (override)) -
   separate from CASE_RESULTS, which holds the AGENT's recommendation. Drives the case-card badges. */
const CASE_HUMAN_STATE = {};

function humanActionBadgeClass(action) {
  const lower = (action || "").toLowerCase();
  if (lower.indexOf("escalate") !== -1) return "danger";
  if (lower.indexOf("edit") !== -1) return "warn";
  if (lower.indexOf("approve") !== -1) return "ok";
  return "neutral";
}

/* What happens after the person's click. Honest about what this demo does not do. */
function nextStepText(action) {
  const a = (action || "").toLowerCase();
  if (a.indexOf("escalate") !== -1) return "Recorded and sent to the compliance officer with your note. The compliance officer's own view is not built in this demo.";
  if (a.indexOf("override") !== -1) return "Recorded as an override of ScreenGate's recommendation. The company's payment system would now decide whether to release the payment. That link is not built in this demo.";
  if (a.indexOf("approve") !== -1) return "Recorded. The company's payment system would now release this payment. That link is not built in this demo.";
  if (a.indexOf("edit") !== -1) return "Your edit is saved. Now Approve or Escalate to finish.";
  return "";
}

function renderGate(id) {
  return "<div style=\"margin-top: var(--sp-4); display:flex; gap: var(--sp-2); align-items:center; flex-wrap: wrap;\">" +
    "<button class=\"btn approve\" onclick=\"approveCase('" + id + "')\">Approve</button>" +
    "<button class=\"btn\" onclick=\"startEdit('" + id + "')\">Edit</button>" +
    "<button class=\"btn danger\" onclick=\"escalateCase('" + id + "')\">Escalate</button>" +
    "<span id=\"gateStatus-" + id + "\" style=\"font-size: var(--fs-0); color: var(--ink-3);\"></span>" +
    "</div>" +
    "<div id=\"escalateArea-" + id + "\" style=\"display:none; margin-top: var(--sp-3);\">" +
    "<label for=\"escalateText-" + id + "\" style=\"font-size: var(--fs-0); color: var(--ink-2);\">One-line reason for escalating this payment to the compliance officer</label><br>" +
    "<input type=\"text\" id=\"escalateText-" + id + "\" placeholder=\"For example: Confirmed sanctions match\" style=\"width:100%; margin-top: var(--sp-1); font-family: var(--font-body); font-size: var(--fs-1); background: var(--bg-inset); color: var(--ink); border: var(--border-w) solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-2);\" onkeydown=\"if (event.key === 'Enter') confirmEscalate('" + id + "')\"><br>" +
    "<button class=\"btn danger\" style=\"margin-top: var(--sp-2);\" onclick=\"confirmEscalate('" + id + "')\">Send to compliance officer</button> " +
    "<button class=\"btn\" style=\"margin-top: var(--sp-2);\" onclick=\"cancelEscalate('" + id + "')\">Cancel</button>" +
    "</div>" +
    "<div id=\"editArea-" + id + "\" style=\"display:none; margin-top: var(--sp-3);\">" +
    "<textarea id=\"editText-" + id + "\" rows=\"3\" style=\"width:100%; font-family: var(--font-body); font-size: var(--fs-1); background: var(--bg-inset); color: var(--ink); border: var(--border-w) solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-2);\"></textarea><br>" +
    "<button class=\"btn primary\" style=\"margin-top: var(--sp-2);\" onclick=\"saveEdit('" + id + "')\">Save edit</button>" +
    "</div>" +
    "<p class=\"boundary-note\" id=\"nextStep-" + id + "\" style=\"" + (CASE_HUMAN_STATE[id] ? "" : "display:none;") + "\">" + escapeHtml(nextStepText(CASE_HUMAN_STATE[id])) + "</p>" +
    "<p class=\"boundary-note\">Nothing is sent without human approval.</p>";
}

function logRun(transactionId, humanAction, note) {
  const result = CASE_RESULTS[transactionId];
  RUN_LOG.push({
    time: new Date().toLocaleTimeString(),
    transactionId: transactionId,
    agentDecision: (result && result.RECOMMENDED_DECISION) || "(no decision)",
    humanAction: humanAction,
    note: note || ""
  });
  CASE_HUMAN_STATE[transactionId] = humanAction;
  const statusEl = document.getElementById("gateStatus-" + transactionId);
  if (statusEl) statusEl.textContent = humanAction + " at " + new Date().toLocaleTimeString() + (note ? " - " + note : "");
  const nextEl = document.getElementById("nextStep-" + transactionId);
  if (nextEl) { nextEl.textContent = nextStepText(humanAction); nextEl.style.display = ""; }
  renderRunLog();
  renderCaseList();
  refreshPaymentBanner(transactionId);
}

function approveCase(id) {
  const result = CASE_RESULTS[id];
  const decision = ((result && result.RECOMMENDED_DECISION) || "").toLowerCase();
  const wasEscalation = decision.indexOf("escalate") !== -1;

  if (wasEscalation) {
    const confirmed = confirm("The agent recommended escalation for this case. Approve anyway? This will be logged as a human override.");
    if (!confirmed) return;
    logRun(id, "Approved (override)", "");
    return;
  }

  logRun(id, "Approved", "");
}

/* Escalate asks for its one-line reason in a box on the page (not a browser pop-up, which can be
   blocked or missed), then sends on the button click. */
function escalateCase(id) {
  const area = document.getElementById("escalateArea-" + id);
  if (!area) return;
  area.style.display = "block";
  const input = document.getElementById("escalateText-" + id);
  if (input) input.focus();
}

function confirmEscalate(id) {
  const input = document.getElementById("escalateText-" + id);
  const reason = input ? input.value.trim() : "";
  const area = document.getElementById("escalateArea-" + id);
  if (area) area.style.display = "none";
  logRun(id, "Escalated", reason);
}

function cancelEscalate(id) {
  const area = document.getElementById("escalateArea-" + id);
  if (area) area.style.display = "none";
}

function startEdit(id) {
  const area = document.getElementById("editArea-" + id);
  const textarea = document.getElementById("editText-" + id);
  const result = CASE_RESULTS[id];
  textarea.value = result && result.WHY ? result.WHY : "";
  area.style.display = "block";
}

function saveEdit(id) {
  const textarea = document.getElementById("editText-" + id);
  const editedText = textarea.value;
  if (CASE_RESULTS[id]) CASE_RESULTS[id].WHY = editedText;
  document.getElementById("editArea-" + id).style.display = "none";
  logRun(id, "Edited", editedText);
}

/* Each payment's own story, drawn from the same activity log. */
function renderPaymentHistory(id) {
  const rows = RUN_LOG.filter(function (e) { return e.transactionId === id; });
  let html = "<div class=\"zone\"><div class=\"zone-label\">History of this payment</div>";
  if (rows.length === 0) {
    html += "<p class=\"boundary-note\" style=\"margin-top:0;\">Nothing has happened to this payment yet.</p>";
  }
  rows.forEach(function (e) {
    const detail = e.humanAction +
      (e.system && e.agentDecision && e.agentDecision !== "-" ? " - recommended: " + e.agentDecision : "") +
      (e.note ? " - " + e.note : "");
    html += "<div class=\"field\"><div class=\"k\">" + escapeHtml(e.time) + "</div><div class=\"v\">" + escapeHtml(detail) + "</div></div>";
  });
  return html + "</div>";
}

function refreshHistory(id) {
  const el = id ? document.getElementById("history-" + id) : null;
  if (el) el.innerHTML = renderPaymentHistory(id);
}

function renderRunLog() {
  const panel = document.getElementById("runLogPanel");
  const countEl = document.getElementById("runLogCount");
  if (countEl) countEl.textContent = RUN_LOG.length;
  refreshHistory(selectedCaseId);

  if (RUN_LOG.length === 0) {
    panel.innerHTML = "<p class=\"boundary-note\">Nothing recorded yet. Check a payment, then Approve, Edit, or Escalate it.</p>";
    return;
  }

  let html = "";
  RUN_LOG.slice().reverse().forEach(function (entry) {
    const actionLower = entry.humanAction.toLowerCase();
    const actionClass = (entry.system || actionLower.indexOf("received") !== -1) ? ""
      : actionLower.indexOf("approve") !== -1 ? "action-approve"
      : actionLower.indexOf("edit") !== -1 ? "action-edit"
      : "action-escalate";
    html += "<div class=\"row\"><span class=\"t\">" + escapeHtml(entry.time) + "</span><span>" +
      escapeHtml(entry.transactionId) + " &mdash; " + escapeHtml(entry.agentDecision) + " &mdash; " +
      "<span class=\"" + actionClass + "\">" + escapeHtml(entry.humanAction) + "</span>" +
      (entry.note ? " (" + escapeHtml(entry.note) + ")" : "") + "</span></div>";
  });
  panel.innerHTML = html;
}

/* ---------- Section C: the Evals view ---------- */

  document.getElementById("todayStrip").style.display = view === "console" ? "block" : "none";

  if (view === "evals") renderEvalsView();
}

const EVAL_STORAGE_KEY = "screengate_eval_records";

/* True when the table below shows the creator's recorded results rather than this visitor's own runs. */
let EVAL_SHOWING_RECORDED = false;

function loadEvalRecords() {
  if (!forcedRecorded()) {
    try {
      const raw = localStorage.getItem(EVAL_STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (err) { /* fall through to the recorded defaults */ }
  }
  if (Object.keys(RECORDED_EVAL_RECORDS).length > 0) {
    EVAL_SHOWING_RECORDED = true;
    return JSON.parse(JSON.stringify(RECORDED_EVAL_RECORDS));
  }
  return {};
}

function saveEvalRecords() {
  if (forcedRecorded()) return;   /* the recorded view never overwrites this browser's own saved test runs */
  try {
    localStorage.setItem(EVAL_STORAGE_KEY, JSON.stringify(EVAL_RECORDS));
  } catch (err) {
    /* localStorage unavailable - eval state stays in memory for this session only */
  }
}

const EVAL_RECORDS = loadEvalRecords();

function setEvalField(caseId, field, value) {
  if (!EVAL_RECORDS[caseId]) EVAL_RECORDS[caseId] = {};
  EVAL_RECORDS[caseId][field] = value;
  saveEvalRecords();
}

function computeEvalStats() {
  let pass = 0, needsWork = 0, fail = 0, totalRun = 0, lastRun = null;
  EVAL_CASES.forEach(function (ec) {
    const r = EVAL_RECORDS[ec.caseId];
    if (!r) return;
    if (r.verdict === "Pass") pass++;
    else if (r.verdict === "Needs work") needsWork++;
    else if (r.verdict === "Fail") fail++;
    if (r.actual) totalRun++;
    if (r.lastRun && (!lastRun || r.lastRun > lastRun)) lastRun = r.lastRun;
  });
  return { pass: pass, needsWork: needsWork, fail: fail, totalRun: totalRun, lastRun: lastRun };
}

function statBlock(cls, n, label) {
  return "<div class=\"stat" + (cls ? " " + cls : "") + "\"><div class=\"n\">" + escapeHtml(String(n)) + "</div><div class=\"l\">" + escapeHtml(label) + "</div></div>";
}

function renderEvalScoreboard() {
  const s = computeEvalStats();
  const lastRunText = s.lastRun ? new Date(s.lastRun).toLocaleString() : "Never";
  let html = "<div class=\"scoreboard\">";
  html += statBlock("ok", s.pass, "Pass");
  html += statBlock("warn", s.needsWork, "Needs Work");
  html += statBlock("danger", s.fail, "Fail");
  html += statBlock("", s.totalRun + " / " + EVAL_CASES.length, "Test cases run");
  html += statBlock("", lastRunText, "Last Run");
  html += "</div>";
  return html;
}

/* Runs one case against the live API. Returns "ok", "escalate", or "error" so callers
   (a single Run click, or Run All) can both update the UI and tally an outcome. */
/* resultEl (the case's box in the Console view) may not exist - e.g. when this is called
   from the Evals view for a case that isn't the currently selected one in Console. The API
   call and CASE_RESULTS update always happen; the Console-view DOM update is best-effort. */
/* ---------- Recorded examples: what a visitor with no AI key sees ----------
   RECORDED_RESULTS holds real answers saved from the creator's own live runs (never written by hand).
   With no key, those payments show the saved answer, clearly labelled. With a key, everything runs live. */
/* The recorded-examples link (.../recorded-examples/ or ?recorded) always shows the recorded view,
   even if this browser has an AI key saved. The saved key is simply not used there. */
function forcedRecorded() { return /[?&#]recorded\b/.test(window.location.href); }

function hasApiKey() {
  if (forcedRecorded()) return false;
  try { return !!localStorage.getItem(API_KEY_STORAGE_KEY); } catch (err) { return false; }
}
function recordedMode() { return !hasApiKey() && Object.keys(RECORDED_RESULTS).length > 0; }
function hasRecorded(id) { return !!RECORDED_RESULTS[id]; }

/* Creator mode: the address ends in ?export (or #export). Shows a banner with a Copy results button. */
function exportMode() { return /[?&#]export\b/.test(window.location.href); }

function copyResultsClicked() {
  const n = exportRecordedResults();
  const el = document.getElementById("recordedBanner");
  if (el) el.innerHTML = "<strong>Export mode.</strong> Copied " + n + " results to your clipboard, and they are in the box below. " +
    "Paste them into Claude. <button class=\"btn\" onclick=\"copyResultsClicked()\">Copy results again</button>";
}

function refreshRecordedBanner() {
  const el = document.getElementById("recordedBanner");
  if (!el) return;
  if (exportMode()) {
    el.style.display = "block";
    el.innerHTML = "<strong>Export mode is on (creator only).</strong> Run your payments with your own AI key, then click " +
      "<button class=\"btn\" onclick=\"copyResultsClicked()\">Copy results</button> and paste them into Claude.";
    return;
  }
  if (!recordedMode()) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = "<strong>Recorded examples.</strong> No AI key found, so you are seeing saved results from real runs, not live checks. " +
    "Try it: click <strong>Check for new payments</strong> (or <strong>Load sample payments</strong>), open a payment, then Approve or Escalate it. " +
    (forcedRecorded()
      ? "To run ScreenGate live on any payment with your own AI key, <a href=\"./\" style=\"color: var(--accent);\">open the normal link</a>."
      : "Add your own AI key (top right) to run ScreenGate live on any payment.");
}

/* Creator tool: open the page with ?export, run payments with a real key, then copy the results. */
function exportRecordedResults() {
  const results = {};
  Object.keys(CASE_RESULTS).forEach(function (id) {
    const r = CASE_RESULTS[id];
    if (r && r.RECOMMENDED_DECISION && r.RECOMMENDED_DECISION.indexOf("(") !== 0 && !r._recorded) {
      const copy = Object.assign({}, r); delete copy._recorded; results[id] = copy;
    }
  });
  const text = JSON.stringify({ results: results, evals: EVAL_RECORDS }, null, 1);
  const box = document.getElementById("exportBox");
  if (box) { box.style.display = "block"; box.value = text; box.select(); }
  try { navigator.clipboard.writeText(text); } catch (err) { /* the text box is the fallback */ }
  return Object.keys(results).length;
}

async function runCaseCore(transactionId) {
  const t = TRANSACTIONS.find(function (x) { return x.id === transactionId; });
  const resultEl = document.getElementById("result-" + transactionId);
  const apiKey = hasApiKey() ? localStorage.getItem(API_KEY_STORAGE_KEY) : null;

  if (!apiKey && RECORDED_RESULTS[transactionId]) {
    if (resultEl) resultEl.innerHTML = "<span class=\"thinking\">Loading the recorded example...</span>";
    await new Promise(function (resolve) { setTimeout(resolve, 900); });
    const recorded = Object.assign({}, RECORDED_RESULTS[transactionId], { _recorded: true });
    CASE_RESULTS[transactionId] = recorded;
    RUN_LOG.push({
      time: new Date().toLocaleTimeString(),
      transactionId: transactionId,
      agentDecision: recorded.RECOMMENDED_DECISION || "-",
      humanAction: "Recorded example shown (not a live check)",
      note: "",
      system: true
    });
    renderRunLog();
    if (resultEl) resultEl.innerHTML = renderParsedOutput(recorded, transactionId);
    refreshRecommendation(transactionId);
    return (recorded.RECOMMENDED_DECISION || "").toLowerCase().indexOf("escalate") !== -1 ? "escalate" : "ok";
  }

  if (!apiKey) {
    openKeyPanel();
    if (resultEl) resultEl.innerHTML = "<div class=\"error-note\">" + (Object.keys(RECORDED_RESULTS).length > 0
      ? "There is no recorded example for this payment. To run it, add your own Anthropic API key in the box that just opened at the top, then click Run this payment again."
      : "To run the AI, add your own Anthropic API key in the box that just opened at the top, then click Run this payment again.") + "</div>";
    return "error";
  }

  if (resultEl) resultEl.innerHTML = "<span class=\"thinking\">Thinking...</span>";

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: buildCaseMessage(t) }]
      })
    });

    if (!response.ok) {
      let bodyText = "";
      try { bodyText = await response.text(); } catch (readErr) { bodyText = ""; }
      let message;
      if (response.status === 401) {
        message = "Error: the API key was rejected (401 Unauthorized). Check the key you saved in Settings.";
      } else if (response.status === 429) {
        message = "Error: rate limited or out of credit (429 Too Many Requests). Check your Anthropic account balance and try again.";
      } else {
        message = "Error " + response.status + " from the API: " + bodyText;
      }
      if (resultEl) resultEl.innerHTML = "<div class=\"error-note\">" + escapeHtml(message) + "</div>";
      return "error";
    }

    const data = await response.json();
    const text = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : JSON.stringify(data);
    const parsed = parseAgentOutput(text);
    if (parsed) {
      CASE_RESULTS[transactionId] = parsed;
      RUN_LOG.push({
        time: new Date().toLocaleTimeString(),
        transactionId: transactionId,
        agentDecision: parsed.RECOMMENDED_DECISION || "-",
        humanAction: "ScreenGate checked this payment",
        note: "",
        system: true
      });
      renderRunLog();
      if (resultEl) resultEl.innerHTML = renderParsedOutput(parsed, transactionId);
      refreshRecommendation(transactionId);
      const decision = (parsed.RECOMMENDED_DECISION || "").toLowerCase();
      return decision.indexOf("escalate") !== -1 ? "escalate" : "ok";
    } else {
      CASE_RESULTS[transactionId] = { RECOMMENDED_DECISION: "(unparsed output)" };
      if (resultEl) resultEl.innerHTML = "<span class=\"badge warn\">UNPARSED</span>" +
        "<p class=\"boundary-note\">Agent output did not match the expected format. Showing raw text below.</p>" +
        "<pre style=\"white-space: pre-wrap; background: var(--bg-inset); border: var(--border-w) solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-0); color: var(--ink-2);\">" +
        escapeHtml(text) + "</pre>" +
        renderGate(transactionId);
      return "error";
    }
  } catch (err) {
    if (resultEl) resultEl.innerHTML = "<div class=\"error-note\">Error: could not reach the Anthropic API. Check your internet connection. (" + escapeHtml(err.message) + ")</div>";
    return "error";
  }
}

async function runCase(transactionId) {
  if (SCREENING_NOW[transactionId]) return;   /* already being checked: ignore a second click */
  SCREENING_NOW[transactionId] = true;
  refreshRecommendation(transactionId);
  try {
    await runCaseCore(transactionId);
  } finally {
    delete SCREENING_NOW[transactionId];
  }
  refreshRecommendation(transactionId);
  renderCaseList();
  /* On a phone, bring the findings and the Approve / Edit / Escalate buttons into view. */
  if (isNarrowScreen() && selectedCaseId === transactionId) {
    const res = document.getElementById("result-" + transactionId);
    if (res && res.children.length) res.scrollIntoView({ block: "start" });
  }
}

async function runAll() {
  if (checkingAll || simulating) return;
  let errorCount = 0, paused = false, done = 0;

  /* Only listed payments that ScreenGate has not checked yet (re-checking would cost extra calls). */
  const batch = listedTransactions().filter(function (t) { return caseState(t.id) === "new" && (!recordedMode() || hasRecorded(t.id)); });
  if (batch.length === 0) {
    runAllProgressText = "Nothing waiting to be checked. Click Check for new payments or Load sample payments first.";
    renderCaseList();
    return;
  }

  checkingAll = true;
  pauseRequested = false;
  try {
    for (let i = 0; i < batch.length; i++) {
      if (pauseRequested) { paused = true; break; }
      const t = batch[i];
      /* selectCase() and renderCaseList() rebuild the whole left panel, so progress text is
         kept in runAllProgressText (rendered by renderCaseList) rather than in cached elements. */
      runAllProgressText = "Checking " + (i + 1) + " of " + batch.length + ": " + t.id + "...";
      SCREENING_NOW[t.id] = true;
      selectCase(t.id);

      const outcome = await runCaseCore(t.id);
      delete SCREENING_NOW[t.id];
      done++;
      if (outcome !== "ok" && outcome !== "escalate") errorCount++;
      renderCaseList();
    }
  } finally {
    checkingAll = false;
  }

  runAllProgressText = paused
    ? "Paused after " + done + " of " + batch.length + ". Click Run all waiting payments to continue with the rest."
    : "Done - checked " + done + " payments.";
  if (errorCount > 0) {
    runAllProgressText += " " + errorCount + " could not be checked (see the activity log).";
  }
  renderCaseList();
}

/* ---------- Settings: API key lives only in localStorage, never in this file ---------- */

function updateKeyStatus() {
  const status = document.getElementById("keyStatus");
  const chip = document.getElementById("keyChip");
  if (forcedRecorded()) {
    status.textContent = "Recorded examples view: a saved key is not used here. Open the normal link to run live.";
    if (chip) chip.textContent = "Recorded examples view";
    refreshRecordedBanner();
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(API_KEY_STORAGE_KEY); } catch (err) { saved = null; }
  status.textContent = saved ? "Key saved." : "No key saved yet. Paste your Anthropic API key here.";
  if (chip) chip.textContent = saved ? "AI key: saved" : "AI key: needed";
  refreshRecordedBanner();
}

/* The key box stays hidden (so it never appears in a recording) until the chip is clicked
   or someone tries to Run without a key. */
function toggleKeyPanel() {
  const panel = document.getElementById("settingsPanel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
  if (panel.style.display === "block") document.getElementById("apiKeyInput").focus();
}

function openKeyPanel() {
  const panel = document.getElementById("settingsPanel");
  panel.style.display = "block";
  document.getElementById("apiKeyInput").focus();
}

document.getElementById("saveKeyBtn").addEventListener("click", function () {
  const input = document.getElementById("apiKeyInput");
  const value = input.value.trim();
  if (value) {
    localStorage.setItem(API_KEY_STORAGE_KEY, value);
    input.value = "";
    document.getElementById("settingsPanel").style.display = "none";
  }
  updateKeyStatus();
});

document.getElementById("clearKeyBtn").addEventListener("click", function () {
  localStorage.removeItem(API_KEY_STORAGE_KEY);
  updateKeyStatus();
});

/* ---------- Initial render: run first so the page shows data even if Settings/localStorage misbehaves ---------- */

renderCaseList();
renderMainPanel();
renderRunLog();
updateKeyStatus();
showView("console");
</script>
